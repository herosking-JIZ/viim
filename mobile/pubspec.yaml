name: ndjigi_mobile
description: N'DJIGI - Plateforme de mobilité (Flutter Mobile)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.3.0

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # Navigation & routing
  go_router: ^11.0.0

  # State management
  provider: ^6.0.0

  # Phone number validation
  libphonenumber: ^2.3.0

  # QR Code generation for TOTP setup
  qr_flutter: ^4.1.0

  # Date & time
  intl: ^0.19.0

  # Logging
  logger: ^2.0.0

  # Environment variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets (app icon, images, etc.)
  assets:
    - assets/images/
    - .env

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
